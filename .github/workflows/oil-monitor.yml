name: Oil monitor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oil-monitor.yml"
      - "analyze_news.py"
      - "oil_monitor.py"
      - "tests/**"
      - "site/**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oil-monitor
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Collect oil prices and news
        run: |
          output_path="data/oil/$(date -u +%F).jsonl"
          python oil_monitor.py \
            --once \
            --output "$output_path" \
            --state-db data/oil_monitor_state.sqlite3
          echo "OIL_OUTPUT_PATH=$output_path" >> "$GITHUB_ENV"

      - name: Analyze new headlines with the managed Antigravity agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python analyze_news.py --file "$OIL_OUTPUT_PATH"

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OIL_OUTPUT_PATH" data/oil_monitor_state.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m "Update oil monitor data"
            git push
          fi

  deploy-dashboard:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository data
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up dashboard data
        run: |
          mkdir -p site/data/oil
          cp data/oil/*.jsonl site/data/oil/
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(path.name for path in Path("site/data/oil").glob("*.jsonl"))
          Path("site/data/oil/index.json").write_text(
              json.dumps({"files": files}), encoding="utf-8"
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
